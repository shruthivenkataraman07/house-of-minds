# Databricks Asset Bundle for THE HOUSE OF MINDS (Phase 2).
# Validate: databricks bundle validate -t dev
# Deploy:   databricks bundle deploy -t dev     (uploads code, creates the job; no compute)
# Run:      databricks bundle run step2_pipeline -t dev   (uses serverless compute + warehouse)
bundle:
  name: house_of_minds

variables:
  warehouse_id:
    description: SQL warehouse used by the analytics SQL
    default: cf173e33d1a9762c
  catalog:
    default: workspace
  schema:
    default: house_of_minds

sync:
  include:
    - reports/dataset_manifest.json
  exclude:
    - data/**
    - frontend/**
    - .venv/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: HOUSE_OF_MINDS_FREE

resources:
  jobs:
    step2_pipeline:
      name: house-of-minds-step2-pipeline
      description: >-
        Step 2 validation on Unity Catalog. Verifies the 31 official source tables (never
        reloads them), runs the 14 financial reconciliation checks, the fair machine
        comparison and the six data contracts, then rebuilds the evidence ledger and writes
        validation_summary. Manual trigger only (no cadence agreed).
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: verify_sources
          environment_key: default
          spark_python_task:
            python_file: scripts/step2_tasks.py
            parameters: [verify_sources, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}"]
        - task_key: reconciliation
          depends_on: [{task_key: verify_sources}]
          environment_key: default
          spark_python_task:
            python_file: scripts/step2_tasks.py
            parameters: [reconciliation, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}"]
        - task_key: machine_comparison
          depends_on: [{task_key: reconciliation}]
          environment_key: default
          spark_python_task:
            python_file: scripts/step2_tasks.py
            parameters: [machine_comparison, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}"]
        - task_key: data_contracts
          depends_on: [{task_key: reconciliation}]
          environment_key: default
          spark_python_task:
            python_file: scripts/step2_tasks.py
            parameters: [data_contracts, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}"]
        - task_key: evidence_summary
          depends_on: [{task_key: machine_comparison}, {task_key: data_contracts}]
          environment_key: default
          spark_python_task:
            python_file: scripts/step2_tasks.py
            parameters: [evidence_summary, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pydantic>=2.8
              - pydantic-settings>=2.4
              - duckdb>=1.1
              - statsmodels>=0.14
              - databricks-sql-connector>=3.4
              - databricks-sdk>=0.30

    step3_decision_engine:
      name: house-of-minds-step3-decision-engine
      description: >-
        Step 3: evidence-constrained $100K portfolio optimisation (CP-SAT), Decision-Reversal
        Engine, scenario re-optimisation, regret and assumption invalidation. Reads Step 1/2
        tables, writes nine Step 3 tables, never modifies Step 2 outputs. Manual trigger.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: decision_engine
          environment_key: default
          spark_python_task:
            python_file: scripts/run_step3.py
            parameters: [--backend, databricks, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}",
                         --output-dir, /tmp/house_of_minds, --job-run-id, "{{job.run_id}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pydantic>=2.8
              - pydantic-settings>=2.4
              - duckdb>=1.1
              - statsmodels>=0.14
              - databricks-sql-connector>=3.4
              - databricks-sdk>=0.30

    step4_whisper_council:
      name: house-of-minds-step4-whisper-council
      description: >-
        Step 4 (RULE_BASED): six specialist agents, Whisper Network (2 rounds, 2 msgs/agent/
        round), deterministic verifier, Step 3 optimiser integration, gossip-off vs gossip-on
        comparison, 40 acceptance gates + 21 negative cases. Reads Steps 1-3, writes eight
        council tables, never modifies earlier outputs. Manual trigger.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: whisper_council
          environment_key: default
          spark_python_task:
            python_file: scripts/run_step4.py
            parameters: [--backend, databricks, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}",
                         --output-dir, /tmp/house_of_minds, --job-run-id, "{{job.run_id}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pydantic>=2.8
              - pydantic-settings>=2.4
              - duckdb>=1.1
              - databricks-sql-connector>=3.4
              - databricks-sdk>=0.30

    step5_proving_grounds:
      name: house-of-minds-step5-proving-grounds
      description: >-
        Step 5 (protocol step5-protocol-v1): weekday-mean baseline vs Holt-Winters on a
        chronological May-Jun holdout of daily floor theo; past-only promotion
        counterfactuals fed to the Step 3 optimiser; council ablation recomputed from Step 4
        records; known-answer verifier set; robustness; measurement plans; AI/BI views;
        40 gates. Reads Steps 1-4, never modifies them. Manual trigger.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: proving_grounds
          environment_key: default
          spark_python_task:
            python_file: scripts/run_step5.py
            parameters: [--backend, databricks, --warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}",
                         --output-dir, /tmp/house_of_minds, --job-run-id, "{{job.run_id}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pydantic>=2.8
              - pydantic-settings>=2.4
              - duckdb>=1.1
              - statsmodels==0.15.0  # pinned: HW MLE differs across versions
              - databricks-sql-connector>=3.4
              - databricks-sdk>=0.30

    step6_evidence_vault:
      name: house-of-minds-step6-evidence-vault
      description: >-
        Step 6: Decision Passports, Claims & Evidence registry, typed evidence dependency
        graph, invalidation impact (via the Step 3 pathway), measurement accountability,
        AI-use audit, reproducibility manifest, dashboard serving datasets and Ask-the-House
        semantic contract; 40 gates. Reads Steps 1-5 only. Manual trigger.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: evidence_vault
          environment_key: default
          spark_python_task:
            python_file: scripts/run_step6.py
            parameters: [--warehouse-id, "{{job.parameters.warehouse_id}}",
                         --catalog, "${var.catalog}", --schema, "${var.schema}",
                         --output-dir, /tmp/house_of_minds, --job-run-id, "{{job.run_id}}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - pydantic>=2.8
              - pydantic-settings>=2.4
              - duckdb>=1.1
              - databricks-sql-connector>=3.4
              - databricks-sdk>=0.30
