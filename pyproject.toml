[project]
name = "house-of-minds"
version = "0.1.0"
description = "Casino decision intelligence platform — TAMU Datathon Dashboard Royale"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.32",
    "orjson>=3.10",
    # Analytics
    "pandas>=2.2",
    "polars>=1.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.1",
    "pyarrow>=17",
    "statsmodels>=0.14",
    # Machine learning
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow>=2.16",
    "joblib>=1.4",
    # Optimization and simulation
    "ortools>=9.10",
    "networkx>=3.3",
    # AI agents
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "tenacity>=8.5",
    # Persistence
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Databricks (connect is added in Phase 2 once runtime is pinned)
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# user-facing answer and passport sentences are kept on one line for readability
"backend/services/ask.py" = ["E501"]
"backend/services/dashboard.py" = ["E501"]
"scripts/qa_parity.py" = ["E501"]
"analytics/diagnostics.py" = ["E501"]
"tests/unit/test_diagnostics.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["frontend/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
